[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.34'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
ffi = true
fs_permissions =[
    { access = "read-write", path = "./src/deployments/" }
]
remappings = [
    'lib/pas/:@openzeppelin/contracts/=lib/pas/lib/openzeppelin-contracts/contracts/',
    'lib/pas/:dss-test/=lib/pas/lib/dss-test/src/',
    'lib/pas/:src/=lib/pas/src/',
    'lib/pas/lib/dss-test/:dss-interfaces/=lib/pas/lib/dss-test/lib/dss-interfaces/src/',
    'lib/pas/lib/dss-test/:forge-std/=lib/pas/lib/dss-test/lib/forge-std/src/',
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
